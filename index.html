<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFlux Demo</title>
<style>
body {
    margin:0;
    font-family: sans-serif;
    background: #0F172A;
    color: #E2E8F0;
}
header {
    text-align:center;
    padding:50px 20px;
}
button, .btn-ghost {
    background: rgba(0,200,150,0.2);
    color:#00C896;
    border:1px solid #00C896;
    padding:10px 20px;
    cursor:pointer;
    border-radius:8px;
    transition: all 0.3s;
}
button:hover, .btn-ghost:hover {
    background:#00C896;
    color:#0F172A;
}
.metrics {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    margin:30px 0;
}
.metric-card {
    background: rgba(11,61,46,0.3);
    backdrop-filter: blur(10px);
    padding:20px;
    border-radius:15px;
    text-align:center;
    min-width:150px;
}
</style>
</head>
<body>

<header>
    <h1>AI-Powered Circular Energy Intelligence</h1>
    <a href="#contact" class="btn-ghost">Partner With Us</a>
</header>

<section class="metrics">
    <div class="metric-card">Plastic Processed: <span id="plastic-counter">0</span> tons</div>
    <div class="metric-card">Diesel Produced: <span id="diesel-counter">0</span> L</div>
    <div class="metric-card">Carbon Recovered: <span id="carbon-counter">0</span> kg</div>
    <div class="metric-card">Water Purified: <span id="water-counter">0</span> L</div>
    <div class="metric-card">Total Energy: <span id="energy-counter">0</span> kWh</div>
</section>

<section id="contact" style="text-align:center; margin:50px 0;">
    <h2>Contact / Partner Section</h2>
    <p>Send us a message to join SmartFlux.</p>
</section>

<script>
// Demo start values
const metrics = {
  "plastic-counter": 12400,
  "diesel-counter": 6300,
  "carbon-counter": 1120,
  "water-counter": 54000,
  "energy-counter": 182400
};

function animateCounter(id, value){
    let display = document.getElementById(id);
    let current = 0;
    let step = value / 100;
    function update(){
        current += step;
        if(current >= value) current = value;
        display.innerText = Math.floor(current);
        if(current < value) requestAnimationFrame(update);
    }
    update();
}

// Run all counters
for(const id in metrics){
    animateCounter(id, metrics[id]);
}

// Optional: simulate live increment every few seconds
setInterval(() => {
  for(const id in metrics){
      let el = document.getElementById(id);
      let randomIncrease = Math.floor(Math.random() * 5);
      let newValue = parseInt(el.innerText) + randomIncrease;
      if(newValue > metrics[id]) newValue = metrics[id];
      el.innerText = newValue;
  }
}, 2000);
</script>

</body>
</html>
